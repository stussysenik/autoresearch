[project]
name = "tag-calibration"
version = "0.1.0"
description = "Re-tag mymind cards with data-driven taxonomy using DSPy to optimize Gemma 3"
requires-python = ">=3.10"
dependencies = [
    "dspy>=3.1.0",
    "supabase>=2.5.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "tqdm>=4.66.0",
    "openai>=1.50.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests that hit live APIs (deselect with '-m \"not integration\"')",
]
